workflows:
  ios-build:
    name: iOS Build
    environment:
      groups:
        - apple_credentials
      vars:
        XCODE_VERSION: "26.4"
    scripts:
      - name: Install dependencies
        script: |
          if [ -f "Podfile" ]; then
            pod install
          fi
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $(xcode-project detect-bundle-id) \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace $(find . -name "*.xcworkspace" -type d | head -1) \
            --scheme $(xcode-project detect-scheme)
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
