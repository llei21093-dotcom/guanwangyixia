workflows:
  ios-native-build:
    name: iOS Native Build with Pods
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      # 1. 安装 iOS 依赖 (CocoaPods)
      - name: Install iOS Pods
        script: |
          pod install
      
      # 2. 使用 xcodebuild 构建并导出 IPA 包
      - name: Build and Export IPA
        script: |
          # 获取工作区或工程名（如果有 .xcworkspace 则优先使用）
          if [ -f "*.xcworkspace" ]; then
            WORKSPACE=$(ls *.xcworkspace | head -n 1)
            BUILD_CMD="-workspace $WORKSPACE"
          else
            PROJECT=$(ls *.xcodeproj | head -n 1)
            BUILD_CMD="-project $PROJECT"
          fi
          
          # 执行打包命令
          xcodebuild build-for-testing \
            $BUILD_CMD \
            -scheme "YourSchemeName" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios
    artifacts:
      # 3. 指定 IPA 输出路径
      - build/ios/**/*.ipa
